[package]
name = "whatthefile"
version = "0.1.0"
description = "WhatTheFile — local-first semantic file search"
authors = []
edition = "2021"

[lib]
name = "whatthefile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
sqlite-vec = "0.1"
blake3 = "1"
walkdir = "2"
ureq = { version = "2", features = ["json"] }
docx-rs = "0.4"
calamine = "0.24"
pdfium-render = { version = "0.8", features = ["image"] }
image = "0.25"
base64 = "0.22"

leptess = "0.14"
whatlang = "0.16"
log = "0.4"
tempfile = "3"

[dev-dependencies]

# objc2 0.6.x added a debug assertion that verifies every WKUIDelegate protocol
# method exists in the running WebKit before registering it.  On macOS 15 some
# of those selectors are absent, which triggers a panic that propagates through
# the extern "C" did_finish_launching boundary and aborts the process.
# In release builds this assertion is already compiled out; disabling it in dev
# restores the same behaviour — wry simply skips the missing method, which is
# harmless for a file-search app that never uses media capture.
#
# IMPORTANT: the debug_assert! inside declare_class! expands in the *calling*
# crate's compilation unit, not in objc2 itself.  WryWebView is declared in wry
# and ObjC delegates in tao, so all three crates need the override.
# Upstream: https://github.com/tauri-apps/tauri/issues/11496
[profile.dev.package.objc2]
debug-assertions = false

[profile.dev.package.wry]
debug-assertions = false

[profile.dev.package.tao]
debug-assertions = false
